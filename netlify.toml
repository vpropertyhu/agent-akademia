[build]
  command = "node scripts/build-coming-soon.mjs"
  publish = "dist-soon"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.19.0"

[functions]
  directory = "deploy/coming-soon/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
