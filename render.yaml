services:
  - type: web
    name: agent-akademia-ai
    runtime: node
    region: frankfurt
    plan: free
    rootDir: deploy/render
    buildCommand: node --check server.mjs
    startCommand: node server.mjs
    healthCheckPath: /health
    maxShutdownDelaySeconds: 150
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: AGENT_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
